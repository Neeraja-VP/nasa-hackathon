version: '3.8'

services:
  database:
    image: postgis/postgis:16-3.4
    container_name: luna-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-luna_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-luna_password}
      POSTGRES_DB: ${POSTGRES_DB:-luna_navigator}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luna_user -d luna_navigator"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: luna-backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-luna_user}:${POSTGRES_PASSWORD:-luna_password}@database:5432/${POSTGRES_DB:-luna_navigator}
      - ENVIRONMENT=development
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80,http://localhost
      - HORIZONS_API_BASE_URL=https://ssd.jpl.nasa.gov/api/horizons.api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./datasets:/datasets
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: luna-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
